[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 9999999
evm_version = "prague"
viaIR = true

[fuzz]
runs = 100000
max_test_rejects = 100000
fail_on_revert = false
timeout = 300

[profile.deep_fuzz]
fuzz = { runs = 500000 }

[profile.coverage]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
viaIR = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
